[project]
name = "bitwardensync"
version = "0.1.0"
description = "Sync secrets from Bitwarden into a HashiCorp Vault KV store"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "requests>=2.34.2",
]

[project.scripts]
bitwardensync = "bitwardensync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitwardensync"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return style
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "S",    # bandit security checks
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately hardcode fake credentials, assert, and accept unused
# **kwargs in mock signatures.
"tests/*" = ["S101", "S105", "S106", "S107", "ARG001", "ARG002"]
