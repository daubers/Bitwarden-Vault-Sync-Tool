name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

      - name: Notify tests passed
        if: success()
        env:
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          curl -sS -u "${NTFY_USER}:${NTFY_PASSWORD}" \
            -H "Title: bitwardensync tests passed" \
            -H "Tags: white_check_mark" \
            -d "Tests passed on ${{ github.ref_name }} (${{ github.sha }})" \
            "https://notify.daubney.dev/bitwardensync"

      - name: Notify tests failed
        if: failure()
        env:
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          curl -sS -u "${NTFY_USER}:${NTFY_PASSWORD}" \
            -H "Title: bitwardensync tests failed" \
            -H "Priority: high" \
            -H "Tags: x" \
            -d "Tests failed on ${{ github.ref_name }} (${{ github.sha }})" \
            "https://notify.daubney.dev/bitwardensync"
