name: Tests

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

  # Reports on ruff and pytest together, so a lint-only failure still sends a
  # notification. Runs even when a dependency fails, hence `if: always()`.
  notify:
    runs-on: ubuntu-latest
    needs: [ruff, pytest]
    if: always()
    steps:
      - name: Notify CI passed
        if: needs.ruff.result == 'success' && needs.pytest.result == 'success'
        env:
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          curl -sS -u "${NTFY_USER}:${NTFY_PASSWORD}" \
            -H "Title: bitwardensync CI passed" \
            -H "Tags: white_check_mark" \
            -d "Lint and tests passed on ${{ github.ref_name }} (${{ github.sha }})" \
            "https://notify.daubney.dev/bitwardensync"

      - name: Notify CI failed
        if: needs.ruff.result != 'success' || needs.pytest.result != 'success'
        env:
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          curl -sS -u "${NTFY_USER}:${NTFY_PASSWORD}" \
            -H "Title: bitwardensync CI failed" \
            -H "Priority: high" \
            -H "Tags: x" \
            -d "lint=${{ needs.ruff.result }} tests=${{ needs.pytest.result }} on ${{ github.ref_name }} (${{ github.sha }})" \
            "https://notify.daubney.dev/bitwardensync"
